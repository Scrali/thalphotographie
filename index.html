<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>THAL — Photographie</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f17;color:#e9eefc}
    header{padding:28px 18px;max-width:1100px;margin:auto}
    h1{margin:0;font-size:28px}
    p{margin:8px 0 0;color:#a9b6d6}
    .wrap{max-width:1100px;margin:auto;padding:0 18px 40px}
    .tabs{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 18px}
    .tab{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
      color:#e9eefc;padding:10px 12px;border-radius:999px;cursor:pointer}
    .tab.active{background:rgba(120,170,255,.22);border-color:rgba(120,170,255,.55)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04)}
    .card img{width:100%;height:240px;object-fit:cover;display:block;cursor:pointer}
    .card .cap{padding:10px 12px;color:#a9b6d6;font-size:13px}
    /* lightbox */
    .lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px}
    .lb.open{display:flex}
    .lb img{max-width:min(1100px,96vw);max-height:86vh;border-radius:16px}
    .lb .x{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
      color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <h1>THAL — Photographie</h1>
    <p>Galeries générées automatiquement depuis <code>photos/gallery.json</code>.</p>
  </header>

  <div class="wrap">
    <div id="tabs" class="tabs"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="lb" class="lb" aria-hidden="true">
    <button class="x" id="lbClose">Fermer</button>
    <img id="lbImg" alt="">
  </div>

<script>
  const tabsEl = document.getElementById("tabs");
  const gridEl = document.getElementById("grid");
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lbImg");
  const lbClose = document.getElementById("lbClose");

  function openLightbox(src){
    lbImg.src = src;
    lb.classList.add("open");
    lb.setAttribute("aria-hidden","false");
  }
  function closeLightbox(){
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden","true");
    lbImg.src = "";
  }
  lbClose.addEventListener("click", closeLightbox);
  lb.addEventListener("click", (e)=>{ if(e.target === lb) closeLightbox(); });
  window.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeLightbox(); });

  async function load(){
    const res = await fetch("photos/gallery.json", { cache:"no-store" });
    if(!res.ok){
      gridEl.innerHTML = "<p>Impossible de charger photos/gallery.json</p>";
      return;
    }
    const data = await res.json();
    const categories = Object.keys(data);

    if(!categories.length){
      gridEl.innerHTML = "<p>Aucune galerie trouvée.</p>";
      return;
    }

    // Tabs
    tabsEl.innerHTML = "";
    categories.forEach((cat, i)=>{
      const b = document.createElement("button");
      b.className = "tab" + (i===0 ? " active" : "");
      b.textContent = cat;
      b.addEventListener("click", ()=>{
        document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        render(cat, data[cat]);
      });
      tabsEl.appendChild(b);
    });

    // Default
    render(categories[0], data[categories[0]]);
  }

  function render(cat, files){
    gridEl.innerHTML = (files || []).map(f=>{
      const src = `photos/${cat}/${f}`;
      return `
        <div class="card">
          <img src="${src}" alt="${cat}" loading="lazy" onclick="window.__openLB('${src}')">
          <div class="cap">${cat} — ${f}</div>
        </div>
      `;
    }).join("");
  }

  // expose for inline onclick
  window.__openLB = openLightbox;

  load();
</script>
</body>
</html>
