<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAL — Photographie</title>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, sans-serif;
  background:#0b1220;
  color:#fff;
}

header{
  padding:40px 20px 20px;
  text-align:center;
}

h1{
  margin:0;
  font-size:28px;
  letter-spacing:1px;
}

p{
  opacity:.7;
  margin-top:10px;
}

.wrap{
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.category{
  margin-top:40px;
}

.category h2{
  font-size:18px;
  margin-bottom:15px;
  opacity:.8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
}

.grid img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:10px;
  transition:transform .3s ease;
}

.grid img:hover{
  transform:scale(1.03);
}
</style>
</head>

<body>

<header>
  <h1>THAL — Photographie</h1>
  <p>Galeries générées automatiquement</p>
</header>

<div class="wrap" id="gallery"></div>

<script>
async function loadGallery(){
  try{
    const response = await fetch("photos/gallery.json", {cache:"no-store"});
    const data = await response.json();

    const gallery = document.getElementById("gallery");

    Object.keys(data).forEach(category => {

      const section = document.createElement("div");
      section.className = "category";

      const title = document.createElement("h2");
      title.textContent = category;
      section.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";

      data[category].forEach(file => {
        const img = document.createElement("img");
        img.src = `photos/${category}/${file}`;
        img.loading = "lazy";
        grid.appendChild(img);
      });

      section.appendChild(grid);
      gallery.appendChild(section);
    });

  }catch(error){
    document.body.insertAdjacentHTML(
      "beforeend",
      "<p style='color:red;padding:20px'>Erreur chargement galerie</p>"
    );
    console.error(error);
  }
}

loadGallery();
</script>

</body>
</html>
