<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THAL — Galerie</title>
  <meta name="theme-color" content="#0b0f19" />

  <style>
    :root{
      --bg:#070a12;
      --bg2:#0b1020;
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --muted2:rgba(255,255,255,.48);
      --accent:#6ea8ff;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius:18px;
      --radius2:24px;
      --max:1100px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --pad: clamp(14px, 2.6vw, 22px);
      --gap: clamp(12px, 2.2vw, 18px);
    }

    *{box-sizing:border-box; max-width:100%;}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(110,168,255,.20), transparent 55%),
        radial-gradient(1000px 600px at 90% 10%, rgba(167,210,255,.14), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-bottom: calc(var(--safe-bottom) + 10px);
      padding-left: var(--safe-left);
      overflow-x:hidden;
    }

    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding: var(--pad) var(--pad) 70px;}

    .nav{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:10px 12px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 45px rgba(0,0,0,.35);
      position:sticky;
      top: calc(10px + var(--safe-top));
      z-index:50;
    }
    .brand{display:flex; align-items:center; gap:10px; padding:6px 10px; min-width:0;}
    .brand img{width: clamp(42px, 8vw, 58px); height:auto; display:block;}
    .brand .name{font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .brand .name span{color:var(--muted); font-weight:500;}
    .navlinks{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .chip,.btn{
      min-height:44px; display:inline-flex; align-items:center; justify-content:center;
      padding:10px 14px; border-radius:999px; font-weight:700; font-size:14px;
      border:1px solid var(--stroke); background:rgba(255,255,255,.03);
    }
    .btn{
      border-color: rgba(110,168,255,.42);
      background: linear-gradient(180deg, rgba(110,168,255,.24), rgba(110,168,255,.10));
    }

    .card{
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
    }

    h1{margin:18px 0 6px; font-size:26px; letter-spacing:-.3px}
    p.lead{margin:0 0 14px; color:var(--muted); line-height:1.55}

    .pillRow{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0;}
    .pill{
      min-height:40px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }
    .pill.active{
      color:var(--text);
      border-color: rgba(110,168,255,.55);
      background: rgba(110,168,255,.12);
    }

    .filters{
      margin-top:12px;
      padding:14px;
    }
    .fgrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    @media (max-width: 720px){ .fgrid{grid-template-columns:1fr;} }

    label{display:block; font-size:12px; color:var(--muted); font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px;}
    select{
      width:100%;
      min-height:44px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      color:var(--text);
      padding:10px 12px;
      outline:none;
    }

    .rowBetween{
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      margin-top:10px;
    }
    .reset{
      min-height:44px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:var(--text);
      font-weight:800;
      cursor:pointer;
    }

    .tagBox{margin-top:12px; padding:14px;}
    .tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
    .tag{
      min-height:36px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:rgba(255,255,255,.8);
      font-weight:800;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }
    .tag.on{
      border-color: rgba(110,168,255,.55);
      background: rgba(110,168,255,.12);
      color:var(--text);
    }

    .count{color:var(--muted); font-weight:800}

    .masonry{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap:10px;
    }
    @media (max-width: 420px){
      .masonry{grid-template-columns: repeat(2, minmax(0, 1fr));}
    }

    .shot{
      border-radius: 16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
      position:relative;
      min-height: 160px;
      cursor:pointer;
    }
    .shot img{width:100%; height:100%; display:block; object-fit:cover;}
    .shot .cap{
      position:absolute; left:10px; right:10px; bottom:10px;
      padding:10px 12px;
      border-radius:14px;
      background: rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .empty{
      margin-top:12px;
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      line-height:1.5;
    }

    /* Lightbox */
    .lightbox{
      position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,.80);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      touch-action: none; /* important for swipe */
    }
    .lightbox.open{display:flex}
    .lbCard{
      width:min(1100px, 100%);
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10,14,24,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 30px 110px rgba(0,0,0,.65);
    }
    .lbTop{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      font-weight:800;
      font-size:13px;
      color:rgba(255,255,255,.85);
    }
    .lbBtns{display:flex; gap:8px}
    .lbBtn{
      min-height:44px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      color:rgba(255,255,255,.92);
      font-weight:900;
    }
    .lbImgWrap{background:#000}
    .lbImg{
      width:100%;
      height:min(78vh, 820px);
      object-fit:contain;
      display:block;
      background:#000;
    }

    .footer{margin-top:22px; text-align:center; color:var(--muted2); font-size:13px;}
  </style>
</head>

<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="index.html" aria-label="Accueil">
        <img src="assets/logo.svg" alt="THAL" />
        <div class="name">THAL <span>— Galerie</span></div>
      </a>
      <nav class="navlinks">
        <a class="chip" href="index.html">Accueil</a>
        <a class="btn" href="index.html#contact">Me contacter</a>
      </nav>
    </header>

    <h1>Galerie</h1>
    <p class="lead">Filtre par catégorie, puis type et lieu. Ajoute des tags en multi-sélection.</p>

    <div class="pillRow" id="catPills"></div>

    <section class="card filters" aria-label="Filtres">
      <div class="fgrid">
        <div>
          <label for="typeSelect">Type</label>
          <select id="typeSelect"></select>
        </div>
        <div>
          <label for="lieuSelect">Lieu</label>
          <select id="lieuSelect"></select>
        </div>
      </div>

      <div class="rowBetween">
        <div class="count" id="countTxt">0 photo</div>
        <button class="reset" id="resetBtn" type="button">Réinitialiser</button>
      </div>
    </section>

    <section class="card tagBox" aria-label="Tags">
      <label>Tags</label>
      <div class="tags" id="tagsBox"></div>
      <div id="tagsEmpty" class="empty" style="display:none; margin-top:10px;">Aucun tag sur cette sélection.</div>
    </section>

    <div class="masonry" id="grid"></div>
    <div id="emptyMsg" class="empty" style="display:none;">Aucune photo pour cette combinaison.</div>

    <div class="footer">© <span id="y"></span> THAL — Photographie</div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lb" aria-hidden="true">
    <div class="lbCard" role="dialog" aria-modal="true">
      <div class="lbTop">
        <div id="lbTitle">Photo</div>
        <div class="lbBtns">
          <button class="lbBtn" id="prev" type="button" aria-label="Photo précédente">←</button>
          <button class="lbBtn" id="next" type="button" aria-label="Photo suivante">→</button>
          <button class="lbBtn" id="close" type="button" aria-label="Fermer">✕</button>
        </div>
      </div>
      <div class="lbImgWrap">
        <img class="lbImg" id="lbImg" alt="" />
      </div>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    // ===== Utils =====
    const $ = (s)=>document.querySelector(s);
    const escapeHtml = (str)=>String(str).replace(/[&<>"']/g, (m)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));

    // ===== State =====
    let PHOTOS = [];          // {cat,file,type,lieu,tags[],src}
    let CURRENT_CAT = "Tous";
    let CURRENT_TYPE = "Tous";
    let CURRENT_LIEU = "Tous";
    let ACTIVE_TAGS = new Set();

    let FILTERED = [];        // current filtered list (for grid + lightbox)

    // ===== Load (AUTO + META) =====
    async function loadData(){
      const [autoRes, metaRes] = await Promise.all([
        fetch("photos/gallery.auto.json", { cache: "no-store" }),
        fetch("photos/gallery.meta.json", { cache: "no-store" })
      ]);

      if(!autoRes.ok) throw new Error("gallery.auto.json introuvable (HTTP " + autoRes.status + ")");
      if(!metaRes.ok) throw new Error("gallery.meta.json introuvable (HTTP " + metaRes.status + ")");

      const auto = await autoRes.json();
      const meta = await metaRes.json();

      // Build meta index: "Cat||file" -> {type,lieu,tags}
      const metaIndex = new Map();
      for(const cat of Object.keys(meta)){
        for(const type of Object.keys(meta[cat] || {})){
          for(const lieu of Object.keys(meta[cat][type] || {})){
            const files = meta[cat][type][lieu] || {};
            for(const file of Object.keys(files)){
              metaIndex.set(`${cat}||${file}`, {
                type, lieu,
                tags: Array.isArray(files[file]) ? files[file] : []
              });
            }
          }
        }
      }

      const photos = [];
      for(const cat of Object.keys(auto)){
        for(const file of (auto[cat] || [])){
          const m = metaIndex.get(`${cat}||${file}`);
          photos.push({
            cat,
            file,
            type: m?.type || "Tous",
            lieu: m?.lieu || "Tous",
            tags: m?.tags || [],
            src: `photos/${encodeURIComponent(cat)}/${encodeURIComponent(file)}`
          });
        }
      }
      return photos;
    }

    // ===== UI: Categories pills =====
    function renderCategories(){
      const el = $("#catPills");
      const cats = ["Tous", ...new Set(PHOTOS.map(p=>p.cat))];

      el.innerHTML = "";
      cats.forEach(cat=>{
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (cat === CURRENT_CAT ? " active" : "");
        b.textContent = cat;
        b.addEventListener("click", ()=>{
          CURRENT_CAT = cat;
          CURRENT_TYPE = "Tous";
          CURRENT_LIEU = "Tous";
          ACTIVE_TAGS.clear();
          updateAll();
        });
        el.appendChild(b);
      });
    }

    // ===== UI: Type & Lieu selects (dependent) =====
    function renderSelects(){
      const typeSel = $("#typeSelect");
      const lieuSel = $("#lieuSelect");

      const base = PHOTOS.filter(p => CURRENT_CAT === "Tous" ? true : p.cat === CURRENT_CAT);

      const types = ["Tous", ...new Set(base.map(p=>p.type).filter(Boolean))];
      typeSel.innerHTML = types.map(t=>`<option value="${escapeHtml(t)}"${t===CURRENT_TYPE?" selected":""}>${escapeHtml(t)}</option>`).join("");

      const afterType = base.filter(p => CURRENT_TYPE === "Tous" ? true : p.type === CURRENT_TYPE);
      const lieux = ["Tous", ...new Set(afterType.map(p=>p.lieu).filter(Boolean))];
      lieuSel.innerHTML = lieux.map(l=>`<option value="${escapeHtml(l)}"${l===CURRENT_LIEU?" selected":""}>${escapeHtml(l)}</option>`).join("");

      typeSel.onchange = (e)=>{
        CURRENT_TYPE = e.target.value;
        CURRENT_LIEU = "Tous";
        ACTIVE_TAGS.clear();
        updateAll();
      };
      lieuSel.onchange = (e)=>{
        CURRENT_LIEU = e.target.value;
        ACTIVE_TAGS.clear();
        updateAll();
      };
    }

    // ===== Tags =====
    function renderTags(){
      const box = $("#tagsBox");
      const empty = $("#tagsEmpty");

      // tags dispo sur la sélection (cat/type/lieu)
      const base = PHOTOS.filter(p =>
        (CURRENT_CAT === "Tous" || p.cat === CURRENT_CAT) &&
        (CURRENT_TYPE === "Tous" || p.type === CURRENT_TYPE) &&
        (CURRENT_LIEU === "Tous" || p.lieu === CURRENT_LIEU)
      );

      const tagSet = new Set();
      base.forEach(p => (p.tags||[]).forEach(t=>tagSet.add(t)));

      const tags = [...tagSet].sort((a,b)=>a.localeCompare(b));
      box.innerHTML = "";

      if(tags.length === 0){
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      tags.forEach(t=>{
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tag" + (ACTIVE_TAGS.has(t) ? " on" : "");
        b.textContent = t;
        b.addEventListener("click", ()=>{
          if(ACTIVE_TAGS.has(t)) ACTIVE_TAGS.delete(t);
          else ACTIVE_TAGS.add(t);
          updateGrid(); // tags impact direct
          renderTags(); // refresh "on"
        });
        box.appendChild(b);
      });
    }

    // ===== Grid =====
    function applyFilters(){
      const base = PHOTOS.filter(p =>
        (CURRENT_CAT === "Tous" || p.cat === CURRENT_CAT) &&
        (CURRENT_TYPE === "Tous" || p.type === CURRENT_TYPE) &&
        (CURRENT_LIEU === "Tous" || p.lieu === CURRENT_LIEU)
      );

      // multi-tags = AND (tous les tags actifs doivent être présents)
      const tags = [...ACTIVE_TAGS];
      const out = tags.length === 0 ? base : base.filter(p => tags.every(t => (p.tags||[]).includes(t)));

      // tri stable
      out.sort((a,b)=>(a.cat+a.file).localeCompare(b.cat+b.file));
      return out;
    }

    function updateGrid(){
      FILTERED = applyFilters();

      $("#countTxt").textContent = `${FILTERED.length} photo${FILTERED.length>1?"s":""}`;

      const grid = $("#grid");
      const empty = $("#emptyMsg");

      grid.innerHTML = "";
      if(FILTERED.length === 0){
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      FILTERED.forEach((p, idx)=>{
        const d = document.createElement("div");
        d.className = "shot";
        d.innerHTML = `
          <img loading="lazy" src="${p.src}" alt="${escapeHtml(p.cat)}" />
          <div class="cap">
            <span>${escapeHtml(p.cat)} • ${escapeHtml(p.type)} • ${escapeHtml(p.lieu)}</span>
            <span style="color:rgba(255,255,255,.75)">${escapeHtml(p.file)}</span>
          </div>
        `;
        d.addEventListener("click", ()=>openLightbox(idx));
        grid.appendChild(d);
      });
    }

    function updateAll(){
      // pills active class
      document.querySelectorAll("#catPills .pill").forEach(p=>{
        p.classList.toggle("active", p.textContent === CURRENT_CAT);
      });
      renderSelects();
      renderTags();
      updateGrid();
    }

    // ===== Lightbox + swipe =====
    const lb = $("#lb");
    const lbImg = $("#lbImg");
    const lbTitle = $("#lbTitle");
    let LB_INDEX = 0;

    function openLightbox(idx){
      LB_INDEX = idx;
      updateLightbox();
      lb.classList.add("open");
      lb.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox(){
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden","true");
      lbImg.src = "";
      document.body.style.overflow = "";
    }
    function updateLightbox(){
      const p = FILTERED[LB_INDEX];
      if(!p) return;
      lbImg.src = p.src;
      lbTitle.textContent = `${p.cat} — ${p.type} — ${p.lieu}`;
    }
    function prev(){ LB_INDEX = (LB_INDEX - 1 + FILTERED.length) % FILTERED.length; updateLightbox(); }
    function next(){ LB_INDEX = (LB_INDEX + 1) % FILTERED.length; updateLightbox(); }

    $("#close").addEventListener("click", closeLightbox);
    $("#prev").addEventListener("click", prev);
    $("#next").addEventListener("click", next);
    lb.addEventListener("click", (e)=>{ if(e.target === lb) closeLightbox(); });

    window.addEventListener("keydown", (e)=>{
      if(!lb.classList.contains("open")) return;
      if(e.key === "Escape") closeLightbox();
      if(e.key === "ArrowLeft") prev();
      if(e.key === "ArrowRight") next();
    });

    // Swipe (mobile) on lightbox image
    let touchStartX = 0;
    let touchStartY = 0;
    let touching = false;

    lb.addEventListener("touchstart", (e)=>{
      if(!lb.classList.contains("open")) return;
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touching = true;
    }, {passive:true});

    lb.addEventListener("touchend", (e)=>{
      if(!touching || !lb.classList.contains("open")) return;
      touching = false;

      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      // swipe horizontal only
      if(Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;

      if(dx > 0) prev();
      else next();
    }, {passive:true});

    // Reset
    $("#resetBtn").addEventListener("click", ()=>{
      CURRENT_CAT = "Tous";
      CURRENT_TYPE = "Tous";
      CURRENT_LIEU = "Tous";
      ACTIVE_TAGS.clear();
      renderCategories();
      updateAll();
    });

    // Init
    (async ()=>{
      try{
        PHOTOS = await loadData();
        renderCategories();
        updateAll();
      }catch(err){
        $("#grid").innerHTML = `<div class="empty"><b>Erreur chargement</b><br>${escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
