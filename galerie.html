<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Galerie — THAL</title>
  <meta name="description" content="Galerie THAL — filtres dynamiques et tags." />
  <meta name="theme-color" content="#0b0f19" />

  <style>
    :root{
      --bg:#070a12;
      --bg2:#0b1020;
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --muted2:rgba(255,255,255,.48);
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius:18px;
      --radius2:24px;
      --max:1100px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --pad: clamp(14px, 2.6vw, 22px);
      --gap: clamp(12px, 2.2vw, 18px);
    }

    *{box-sizing:border-box; max-width:100%;}
    html,body{height:100%}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(110,168,255,.20), transparent 55%),
        radial-gradient(1000px 600px at 90% 10%, rgba(167,210,255,.14), transparent 55%),
        radial-gradient(900px 600px at 30% 110%, rgba(110,168,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      overflow-x:hidden;
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-bottom: calc(var(--safe-bottom) + 10px);
      padding-left: var(--safe-left);
    }

    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding: var(--pad) var(--pad) 70px;}

    .nav{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:10px 12px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 14px 45px rgba(0,0,0,.35);
      position:sticky;
      top: calc(10px + var(--safe-top));
      z-index:50;
    }
    .brand{display:flex; align-items:center; gap:10px; padding:6px 10px; min-width:0;}
    .brand img{width: clamp(42px, 8vw, 58px); height:auto; display:block; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));}
    .brand .name{font-weight:650; letter-spacing:.2px; display:flex; align-items:baseline; gap:8px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .brand .name span{font-size: clamp(12px, 2.8vw, 14px); color:var(--muted); font-weight:500;}

    .navlinks{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
    .chip,.btn{
      border-radius:999px;
      font-weight:800;
      font-size:14px;
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      transition: transform .15s ease, background .2s ease, border-color .2s ease, filter .2s ease;
    }
    .chip{color:var(--muted); font-weight:700;}
    .btn{
      border-color: rgba(110,168,255,.42);
      background: linear-gradient(180deg, rgba(110,168,255,.24), rgba(110,168,255,.10));
      color:var(--text);
    }
    .chip:hover,.btn:hover{transform: translateY(-1px); background:rgba(255,255,255,.06);}
    .btn:hover{filter:brightness(1.05); border-color: rgba(110,168,255,.65);}

    .card{
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
    }

    h1{margin:18px 2px 10px; font-size:22px; letter-spacing:-.2px;}
    p.lead{margin:0 2px 10px; color:var(--muted); line-height:1.6; font-size:14px;}

    /* Pills categories */
    .pillRow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      transition: background .2s ease, transform .15s ease, border-color .2s ease;
      user-select:none;
      min-height:40px;
    }
    .pill:hover{transform: translateY(-1px); background:rgba(255,255,255,.06)}
    .pill.active{
      color:var(--text);
      border-color: rgba(110,168,255,.55);
      background: rgba(110,168,255,.12);
    }

    /* Filter bar */
    .filters{
      margin-top:12px;
      padding:14px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width:700px){ .filters{grid-template-columns:1fr;} }

    label{display:block; font-size:12px; color:var(--muted2); font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px;}
    select{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-weight:800;
      outline:none;
      min-height:44px;
    }

    /* Tag chips */
    .tags{
      margin-top:12px;
      padding:14px;
    }
    .tagRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
    .tag{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.85);
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      user-select:none;
      min-height:40px;
      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }
    .tag:hover{transform: translateY(-1px); background: rgba(255,255,255,.06);}
    .tag.on{
      border-color: rgba(110,168,255,.55);
      background: rgba(110,168,255,.12);
      color: var(--text);
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:10px;
      flex-wrap:wrap;
    }
    .smallBtn{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.9);
      font-weight:900;
      cursor:pointer;
      min-height:44px;
    }
    .smallBtn:hover{background: rgba(255,255,255,.06);}
    .count{color: var(--muted); font-weight:800;}

    /* Grid */
    .masonry{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap:10px;
    }
    @media (max-width:420px){
      .masonry{grid-template-columns: repeat(2, minmax(0, 1fr));}
    }

    .shot{
      border-radius: 16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
      position:relative;
      min-height: 160px;
      cursor:pointer;
    }
    .shot img{
      width:100%;
      height:100%;
      display:block;
      object-fit: cover;
      transform: scale(1.01);
      transition: transform .35s ease, filter .35s ease;
    }
    .shot:hover img{transform: scale(1.05); filter: contrast(1.02) saturate(1.05)}
    .cap{
      position:absolute;
      left:10px;
      bottom:10px;
      right:10px;
      padding:10px 12px;
      border-radius:14px;
      background: rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color:rgba(255,255,255,.92);
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      opacity:0;
      transform: translateY(6px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .shot:hover .cap{opacity:1; transform: translateY(0)}
    @media (hover:none){
      .cap{opacity:1; transform:none; background:rgba(0,0,0,.35);}
    }

    /* Lightbox */
    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.78);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:200;
      touch-action: pan-y;
    }
    .lightbox.open{display:flex}
    .lbCard{
      width:min(1100px, 100%);
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10,14,24,.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 30px 110px rgba(0,0,0,.65);
      position:relative;
    }
    .lbTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      color:rgba(255,255,255,.85);
      font-weight:800;
      font-size:13px;
    }
    .lbBtns{display:flex; gap:8px}
    .lbBtn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      color:rgba(255,255,255,.92);
      font-weight:900;
      min-height:44px;
    }
    .lbBtn:hover{background: rgba(255,255,255,.08)}
    .lbImgWrap{background:#000}
    .lbImg{
      width:100%;
      height:min(76vh, 760px);
      object-fit:contain;
      display:block;
      background:#000;
    }

    .footer{margin-top:26px; color:var(--muted2); font-size:13px; text-align:center;}
  </style>
</head>

<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="index.html" aria-label="Accueil">
        <img src="assets/logo.svg" alt="THAL" />
        <div class="name">THAL <span>— Galerie</span></div>
      </a>

      <nav class="navlinks">
        <a class="chip" href="index.html">Accueil</a>
        <a class="btn" href="mailto:contact@thalphotographie.ch?subject=Demande%20de%20devis">Me contacter</a>
      </nav>
    </header>

    <h1>Galerie</h1>
    <p class="lead">Filtre par catégorie, puis type et lieu. Ajoute des tags en multi-sélection.</p>

    <div class="pillRow" id="cats"></div>

    <div class="card filters" aria-label="Filtres dynamiques">
      <div>
        <label for="typeSelect">Type</label>
        <select id="typeSelect">
          <option value="">Tous</option>
        </select>
      </div>
      <div>
        <label for="lieuSelect">Lieu</label>
        <select id="lieuSelect">
          <option value="">Tous</option>
        </select>
      </div>

      <div class="toolbar" style="grid-column:1/-1">
        <div class="count" id="count">0 photo</div>
        <button class="smallBtn" id="clearAll" type="button">Réinitialiser</button>
      </div>
    </div>

    <div class="card tags" aria-label="Tags multi-filtrage">
      <div style="font-weight:900">Tags</div>
      <div style="color:var(--muted); font-size:13px; margin-top:6px">Clique pour activer plusieurs tags.</div>
      <div class="tagRow" id="tags"></div>
    </div>

    <div class="masonry" id="grid"></div>

    <div class="footer">© <span id="y"></span> THAL — Photographie</div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lb" aria-hidden="true">
    <div class="lbCard" role="dialog" aria-modal="true">
      <div class="lbTop">
        <div id="lbTitle">Photo</div>
        <div class="lbBtns">
          <button class="lbBtn" id="prev" type="button" aria-label="Photo précédente">←</button>
          <button class="lbBtn" id="next" type="button" aria-label="Photo suivante">→</button>
          <button class="lbBtn" id="close" type="button" aria-label="Fermer">✕</button>
        </div>
      </div>
      <div class="lbImgWrap">
        <img class="lbImg" id="lbImg" alt="" />
      </div>
    </div>
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    // avoid sticky focus after tap
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a,button,select");
      if (a) a.blur();
    }, { passive:true });

    const catsEl = document.getElementById("cats");
    const typeSelect = document.getElementById("typeSelect");
    const lieuSelect = document.getElementById("lieuSelect");
    const tagsEl = document.getElementById("tags");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const clearBtn = document.getElementById("clearAll");

    let galleryData = {};
    let allShots = []; // {cat,file,type,lieu,tags[]}
    let filtered = [];

    let currentCat = "Tous";
    let currentType = "";
    let currentLieu = "";
    let selectedTags = new Set();

    async function loadGallery(){
      const res = await fetch("photos/gallery.json", { cache:"no-store" });
      if(!res.ok){
        gridEl.innerHTML = errorCard("gallery.json introuvable (HTTP " + res.status + ")");
        return;
      }
      galleryData = await res.json();
      buildAllShots();
      renderCats();

      // pré-sélection via URL ?cat=Portraits
      const params = new URLSearchParams(location.search);
      const presetCat = params.get("cat");
      if(presetCat && (presetCat in galleryData)) currentCat = presetCat;

      applyAll();
    }

    function buildAllShots(){
      allShots = [];
      Object.keys(galleryData).forEach(cat=>{
        const arr = galleryData[cat] || [];
        arr.forEach(entry=>{
          if(!entry || !entry.file) return;
          allShots.push({
            cat,
            file: String(entry.file),
            type: entry.type ? String(entry.type) : "",
            lieu: entry.lieu ? String(entry.lieu) : "",
            tags: Array.isArray(entry.tags) ? entry.tags.map(String) : []
          });
        });
      });
    }

    function renderCats(){
      const cats = ["Tous", ...Object.keys(galleryData)];
      catsEl.innerHTML = "";
      cats.forEach(cat=>{
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pill" + (cat === currentCat ? " active" : "");
        b.textContent = cat;
        b.addEventListener("click", ()=>{
          currentCat = cat;
          currentType = "";
          currentLieu = "";
          selectedTags.clear();
          applyAll();
        });
        catsEl.appendChild(b);
      });
    }

    function applyAll(){
      // update active pill
      [...catsEl.querySelectorAll(".pill")].forEach(p=>{
        p.classList.toggle("active", p.textContent === currentCat);
      });

      // base cat filter
      const base = (currentCat === "Tous")
        ? [...allShots]
        : allShots.filter(s => s.cat === currentCat);

      // rebuild dropdown options from base
      rebuildSelect(typeSelect, unique(base.map(s=>s.type).filter(Boolean)), currentType);
      rebuildSelect(lieuSelect, unique(base.map(s=>s.lieu).filter(Boolean)), currentLieu);

      // currentType/currentLieu might not exist anymore
      if(currentType && !hasValue(typeSelect, currentType)) currentType = "";
      if(currentLieu && !hasValue(lieuSelect, currentLieu)) currentLieu = "";
      typeSelect.value = currentType;
      lieuSelect.value = currentLieu;

      // rebuild tags from base (and dropdown selections) to stay relevant
      const preTagBase = base.filter(s =>
        (!currentType || s.type === currentType) &&
        (!currentLieu || s.lieu === currentLieu)
      );

      rebuildTags(preTagBase);

      // final filter with tags multi
      filtered = preTagBase.filter(s => matchTags(s, selectedTags));

      renderGrid();
      countEl.textContent = filtered.length + (filtered.length <= 1 ? " photo" : " photos");
    }

    function rebuildSelect(selectEl, options, keepValue){
      const prev = keepValue || "";
      selectEl.innerHTML = `<option value="">Tous</option>` +
        options.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
      selectEl.value = prev;
    }

    function rebuildTags(baseList){
      // collect tags from baseList:
      // - entry.tags
      // - + type / lieu as tags "type:xxx" "lieu:xxx" ? (optionnel)
      const tagSet = new Set();
      baseList.forEach(s=>{
        (s.tags || []).forEach(t => tagSet.add(String(t)));
      });

      const tags = [...tagSet].sort((a,b)=>a.localeCompare(b, "fr"));
      tagsEl.innerHTML = "";

      if(tags.length === 0){
        tagsEl.innerHTML = `<div style="color:var(--muted);font-weight:800">Aucun tag sur cette sélection.</div>`;
        return;
      }

      tags.forEach(t=>{
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tag" + (selectedTags.has(t) ? " on" : "");
        btn.textContent = t;
        btn.addEventListener("click", ()=>{
          if(selectedTags.has(t)) selectedTags.delete(t);
          else selectedTags.add(t);
          applyAll();
        });
        tagsEl.appendChild(btn);
      });
    }

    function matchTags(shot, set){
      if(set.size === 0) return true;
      const tags = new Set((shot.tags || []).map(String));
      // Tous les tags sélectionnés doivent être présents
      for(const t of set){
        if(!tags.has(t)) return false;
      }
      return true;
    }

    function renderGrid(){
      gridEl.innerHTML = "";
      if(filtered.length === 0){
        gridEl.innerHTML = `<div style="grid-column:1/-1;color:var(--muted);font-weight:800">Aucune photo pour cette combinaison.</div>`;
        return;
      }

      filtered.forEach((s, idx)=>{
        const src = `photos/${encodeURIComponent(s.cat)}/${encodeURIComponent(s.file)}`;
        const labelLeft = [s.cat, s.type].filter(Boolean).join(" • ");
        const labelRight = s.lieu || s.file;

        const card = document.createElement("div");
        card.className = "shot";
        card.innerHTML = `
          <img loading="lazy" src="${src}" alt="${escapeHtml(labelLeft)}" />
          <div class="cap">
            <span>${escapeHtml(labelLeft || s.cat)}</span>
            <span style="color:rgba(255,255,255,.75)">${escapeHtml(labelRight)}</span>
          </div>
        `;
        card.addEventListener("click", ()=>openLightbox(idx));
        gridEl.appendChild(card);
      });
    }

    function unique(arr){
      return [...new Set(arr.map(String))].filter(Boolean);
    }
    function hasValue(selectEl, value){
      return [...selectEl.options].some(o => o.value === value);
    }

    // Dropdown events
    typeSelect.addEventListener("change", ()=>{
      currentType = typeSelect.value;
      selectedTags.clear(); // option: on reset tags quand on change type (plus clair)
      applyAll();
    });
    lieuSelect.addEventListener("change", ()=>{
      currentLieu = lieuSelect.value;
      selectedTags.clear();
      applyAll();
    });

    clearBtn.addEventListener("click", ()=>{
      currentCat = "Tous";
      currentType = "";
      currentLieu = "";
      selectedTags.clear();
      applyAll();
    });

    // ===== Lightbox + swipe =====
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const closeBtn = document.getElementById("close");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    let lbIndex = 0;

    function openLightbox(idx){
      lbIndex = idx;
      updateLightbox();
      lb.classList.add("open");
      lb.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox(){
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden","true");
      lbImg.src = "";
      document.body.style.overflow = "";
    }
    function updateLightbox(){
      const s = filtered[lbIndex];
      if(!s) return;
      const src = `photos/${encodeURIComponent(s.cat)}/${encodeURIComponent(s.file)}`;
      lbImg.src = src;
      const title = [s.cat, s.type, s.lieu].filter(Boolean).join(" — ");
      lbTitle.textContent = title || s.file;
    }
    function prev(){
      lbIndex = (lbIndex - 1 + filtered.length) % filtered.length;
      updateLightbox();
    }
    function next(){
      lbIndex = (lbIndex + 1) % filtered.length;
      updateLightbox();
    }

    closeBtn.addEventListener("click", closeLightbox);
    prevBtn.addEventListener("click", prev);
    nextBtn.addEventListener("click", next);
    lb.addEventListener("click", (e)=>{ if(e.target === lb) closeLightbox(); });

    window.addEventListener("keydown", (e)=>{
      if(!lb.classList.contains("open")) return;
      if(e.key === "Escape") closeLightbox();
      if(e.key === "ArrowLeft") prev();
      if(e.key === "ArrowRight") next();
    });

    // swipe in lightbox
    attachSwipe(lb, { onLeft: next, onRight: prev });

    function attachSwipe(el, {onLeft, onRight}){
      let sx=0, sy=0, dx=0, dy=0, active=false;

      el.addEventListener("touchstart", (e)=>{
        if(!e.touches || e.touches.length!==1) return;
        active=true;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        dx=dy=0;
      }, {passive:true});

      el.addEventListener("touchmove", (e)=>{
        if(!active || !e.touches || e.touches.length!==1) return;
        dx = e.touches[0].clientX - sx;
        dy = e.touches[0].clientY - sy;
      }, {passive:true});

      el.addEventListener("touchend", ()=>{
        if(!active) return;
        active=false;
        if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)*1.2){
          if(dx < 0) onLeft && onLeft();
          else onRight && onRight();
        }
      });
    }

    function errorCard(msg){
      return `
        <div style="grid-column:1/-1; color:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.12);
                    background:rgba(255,255,255,.03); border-radius:16px; padding:14px; line-height:1.5">
          <b>Erreur chargement galerie</b><br/>
          ${escapeHtml(msg)}<br/>
          Vérifie que <code>photos/gallery.json</code> existe et est accessible.
        </div>`;
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, (m)=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }

    loadGallery();
  </script>
</body>
</html>
