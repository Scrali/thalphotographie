name: Generate gallery.auto.json

on:
  push:
    paths:
      - "photos/**"
      - "!photos/gallery.auto.json"
      - "!photos/gallery.meta.json"
      - "!photos/gallery.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Redimensionner les photos trop grandes (max 2400px, jamais d'agrandissement)
        run: |
          find photos -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -not -path "photos/scripts/*" -exec mogrify -resize "2400x2400>" -quality 85 {} +
          find photos -type f -iname "*.png" -not -path "photos/scripts/*" -exec mogrify -resize "2400x2400>" {} +
          find photos -type f -iname "*.webp" -not -path "photos/scripts/*" -exec mogrify -resize "2400x2400>" -quality 85 {} +

      - name: Build gallery.auto.json
        run: |
          python scripts/build_gallery_auto.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # uniquement si des fichiers ont changé (photos redimensionnées et/ou gallery.auto.json)
          if git diff --quiet -- photos/; then
            echo "No changes."
            exit 0
          fi

          git add photos/
          git commit -m "Auto-update gallery.auto.json et redimensionnement des photos"
          git push