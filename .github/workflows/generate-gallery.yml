name: Generate gallery.auto.json

on:
  push:
    paths:
      - "photos/**"
      - "!photos/gallery.auto.json"
      - "!photos/gallery.meta.json"
      - "!photos/gallery.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build gallery.auto.json
        run: |
          python scripts/build_gallery_auto.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # uniquement si le fichier a changé
          if git diff --quiet -- photos/gallery.auto.json; then
            echo "No changes."
            exit 0
          fi

          git add photos/gallery.auto.json
          git commit -m "Auto-update gallery.auto.json"
          git push